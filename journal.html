<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journal — uthman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var r = document.documentElement;
      try {
        var s = JSON.parse(localStorage.getItem('site.settings.cache') || '{}');
        if (s.colors) {
          var map = { bg:'--bg', panel:'--panel', navbar:'--navbar', fg:'--fg', muted:'--muted', accent:'--accent' };
          for (var k in map) if (s.colors[k]) r.style.setProperty(map[k], s.colors[k]);
        }
        if (s.navbarStyle) r.setAttribute('data-navbar-style', s.navbarStyle);
        if (s.navbarVisibility != null) r.style.setProperty('--nav-vis', (Number(s.navbarVisibility) / 100).toFixed(3));
      } catch (e) {}

      r.classList.add('is-loading');
      window.__ready = {
        _s: false, _c: false,
        _maybe: function () { if (this._s && this._c) r.classList.remove('is-loading'); },
        markSettings: function () { this._s = true; this._maybe(); },
        markContent: function () { this._c = true; this._maybe(); }
      };
      setTimeout(function () { r.classList.remove('is-loading'); }, 4000);
    })();
  </script>
</head>
<body class="entry">
  <div class="page-veil" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="liquid-glass" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-grad"></div>
    <div class="bg-paper"></div>
    <div class="bg-overlay"></div>
  </div>

  <header class="top-header">
    <a href="/" class="brand">
      <span class="brand-script">uthman</span>
      <svg class="brand-underline" viewBox="0 0 110 10" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 2 6 C 18 2, 42 9, 64 4 C 82 0, 96 7, 108 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </a>
    <div class="top-rule"></div>
    <a class="top-search" href="/" aria-label="Back to index">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
  </header>

  <main class="entry-main" id="entry-main">
    <!-- rendered by journals.js -->
  </main>

  <footer class="page-footer">
    <div class="footer-grid">
      <div class="footer-brand">
        <p class="brand-script footer-script">uthman</p>
        <p class="footer-tagline">Notes I keep, drawn the way I think — a topic in the middle, arrows out.</p>
      </div>
      <div>
        <h3>Navigate</h3>
        <ul>
          <li><a href="/">Journal</a></li>
          <li><a href="/#about">About</a></li>
          <li><a data-contact-email href="mailto:hi@uthman.xyz">Contact</a></li>
        </ul>
      </div>
      <div>
        <h3>Follow</h3>
        <ul data-socials></ul>
      </div>
      <div class="footer-subscribe">
        <h3>Subscribe</h3>
        <p class="footer-tagline">A note when a new entry drops.</p>
        <form onsubmit="event.preventDefault();this.querySelector('button').textContent='Thanks';">
          <input type="email" inputmode="email" required placeholder="Your email" />
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
    <div class="footer-rule"></div>
    <div class="footer-bottom">
      <p>© 2026 uthman. All rights reserved.</p>
      <p class="footer-bottom-tag">A topic in the middle, arrows out.</p>
    </div>
  </footer>

  <script src="settings.js"></script>
  <script src="journals.js"></script>
</body>
</html>
